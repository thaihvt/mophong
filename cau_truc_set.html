<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu Trúc Dữ Liệu Set Trong C++ - Bài Giảng Tương Tác</title>
    
    <!-- Framework & Thư viện -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            font-size: 16px;
        }

        .code-font { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 13.5px; 
            font-variant-ligatures: none;
        }
        
        .content-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            padding: 28px;
            margin-bottom: 24px;
            border: 1px solid #f1f5f9;
        }

        .tab-btn {
            padding: 10px 20px;
            font-weight: 700;
            border-bottom: 3px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }
        .tab-btn.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
            background: #eff6ff;
            border-radius: 8px 8px 0 0;
        }

        .fade-in { animation: fadeIn 0.35s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .code-line {
            padding: 2px 8px;
            border-radius: 4px;
            transition: background-color 0.2s, border-left 0.2s;
        }
        .code-line.active {
            background-color: rgba(37, 99, 235, 0.25) !important;
            border-left: 4px solid #3b82f6;
            font-weight: 700;
        }

        .sim-btn {
            height: 32px;
            font-size: 11px;
            font-weight: 800;
            padding: 0 14px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
        }
        .sim-btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size=20 }) => {
            const icons = {
                theory: <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z" />,
                sim: <path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2-2v10a2 2 0 0 0 2 2h7 M16 19h6 M19 16l3 3-3 3" />,
                code: <React.Fragment><polyline points="16 18 22 12 16 6" /><polyline points="8 6 2 12 8 18" /></React.Fragment>,
                quiz: <React.Fragment><path d="M9 11l3 3L22 4" /><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" /></React.Fragment>
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="inline mr-2">
                    {icons[name]}
                </svg>
            );
        };

        const Latex = ({ formula, block = false }) => {
            const ref = useRef(null);
            useEffect(() => { 
                if (ref.current && window.katex) {
                    window.katex.render(formula, ref.current, { displayMode: block, throwOnError: false }); 
                }
            }, [formula, block]);
            return <span ref={ref}></span>;
        };

        /* TAB 1: LÝ THUYẾT */
        const TheoryTab = () => {
            return (
                <div className="fade-in space-y-6">
                    <div className="content-card">
                        <h2 className="text-2xl font-bold text-blue-700 mb-4 border-b border-blue-100 pb-2 italic flex items-center">
                            <span className="w-2 h-8 bg-blue-600 rounded mr-3"></span>
                            1. Tổng Quan Về Cấu Trúc Dữ Liệu Set
                        </h2>
                        <div className="space-y-4 text-justify text-base leading-relaxed text-slate-700">
                            <p>
                                Trong C++ STL (Standard Template Library), <strong>std::set</strong> là một loại Associative Container dùng để lưu trữ tập hợp các phần tử với 2 đặc tính cốt lõi:
                            </p>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 my-4">
                                <div className="p-4 bg-blue-50 rounded-xl border border-blue-200">
                                    <h3 className="font-bold text-blue-900 mb-2 text-lg">1. Duy Nhất (Unique)</h3>
                                    <p className="text-sm text-slate-700">Mỗi giá trị chỉ xuất hiện đúng <strong>1 lần</strong> trong set. Nếu chèn một giá trị đã tồn tại, set sẽ tự động bỏ qua.</p>
                                </div>
                                <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-200">
                                    <h3 className="font-bold text-emerald-900 mb-2 text-lg">2. Tự Động Sắp Xếp (Sorted)</h3>
                                    <p className="text-sm text-slate-700">Các phần tử luôn được tự động duy trì theo thứ tự tăng dần (hoặc giảm dần theo cấu hình) nhờ cấu trúc **Cây Nhị Phân Tìm Kiếm Cân Bằng (Red-Black Tree)**.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="content-card">
                        <h2 className="text-xl font-bold text-blue-700 mb-4 italic flex items-center">
                            <span className="w-2 h-6 bg-blue-500 rounded mr-3"></span>
                            2. Cú Pháp Khai Báo & Thao Tác Cơ Bản
                        </h2>
                        <div className="space-y-4 text-base leading-relaxed text-slate-700">
                            <p>Cần khai báo thư viện <code className="bg-slate-100 text-blue-600 px-2 py-0.5 rounded font-mono text-sm">#include &lt;set&gt;</code> trước khi sử dụng:</p>
                            <div className="p-4 bg-slate-900 text-slate-100 rounded-xl font-mono text-sm space-y-2">
                                <div className="text-slate-400">// Khai báo set chứa số nguyên (mặc định tăng dần)</div>
                                <div>set&lt;<span className="text-emerald-400">int</span>&gt; s;</div>
                                <div className="text-slate-400">// Khai báo set sắp xếp giảm dần</div>
                                <div>set&lt;<span className="text-emerald-400">int</span>, greater&lt;<span className="text-emerald-400">int</span>&gt;&gt; s_desc;</div>
                            </div>
                        </div>
                    </div>

                    <div className="content-card">
                        <h2 className="text-xl font-bold text-slate-800 mb-4 italic flex items-center">
                            <span className="w-2 h-6 bg-slate-600 rounded mr-3"></span>
                            3. Các Hàm Thường Dùng & Độ Phức Tạp
                        </h2>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr className="bg-slate-100 border-b border-slate-200">
                                        <th className="p-3 font-bold text-slate-700">Tên Hàm</th>
                                        <th className="p-3 font-bold text-slate-700">Cú Pháp</th>
                                        <th className="p-3 font-bold text-slate-700">Mô Tả Chức Năng</th>
                                        <th className="p-3 font-bold text-slate-700">Độ Phức Tạp</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 text-slate-700">
                                    <tr>
                                        <td className="p-3 font-mono font-bold text-blue-600">insert()</td>
                                        <td className="p-3 font-mono">s.insert(x)</td>
                                        <td className="p-3">Thêm phần tử <Latex formula="x" /> vào set. Bỏ qua nếu <Latex formula="x" /> đã tồn tại.</td>
                                        <td className="p-3 font-mono text-emerald-600"><Latex formula="O(\log N)" /></td>
                                    </tr>
                                    <tr>
                                        <td className="p-3 font-mono font-bold text-blue-600">erase()</td>
                                        <td className="p-3 font-mono">s.erase(x)</td>
                                        <td className="p-3">Xóa giá trị <Latex formula="x" /> (hoặc iterator chỉ tới phần tử) khỏi set.</td>
                                        <td className="p-3 font-mono text-emerald-600"><Latex formula="O(\log N)" /></td>
                                    </tr>
                                    <tr>
                                        <td className="p-3 font-mono font-bold text-blue-600">find()</td>
                                        <td className="p-3 font-mono">s.find(x)</td>
                                        <td className="p-3">Trả về iterator trỏ tới <Latex formula="x" />. Nếu không thấy, trả về <code className="bg-slate-100 px-1 rounded">s.end()</code>.</td>
                                        <td className="p-3 font-mono text-emerald-600"><Latex formula="O(\log N)" /></td>
                                    </tr>
                                    <tr>
                                        <td className="p-3 font-mono font-bold text-blue-600">count()</td>
                                        <td className="p-3 font-mono">s.count(x)</td>
                                        <td className="p-3">Trả về 1 nếu <Latex formula="x" /> có trong set, ngược lại trả về 0.</td>
                                        <td className="p-3 font-mono text-emerald-600"><Latex formula="O(\log N)" /></td>
                                    </tr>
                                    <tr>
                                        <td className="p-3 font-mono font-bold text-blue-600">size()</td>
                                        <td className="p-3 font-mono">s.size()</td>
                                        <td className="p-3">Trả về số lượng phần tử hiện có trong set.</td>
                                        <td className="p-3 font-mono text-emerald-600"><Latex formula="O(1)" /></td>
                                    </tr>
                                    <tr>
                                        <td className="p-3 font-mono font-bold text-blue-600">clear()</td>
                                        <td className="p-3 font-mono">s.clear()</td>
                                        <td className="p-3">Xóa toàn bộ phần tử trong set.</td>
                                        <td className="p-3 font-mono text-emerald-600"><Latex formula="O(N)" /></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="content-card border-t-4 border-t-amber-500">
                        <h2 className="text-xl font-bold text-amber-700 mb-3 italic flex items-center">
                            <span className="w-2 h-6 bg-amber-500 rounded mr-3"></span>
                            4. Mở Rộng: multiset & unordered_set
                        </h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-base text-slate-700 leading-relaxed">
                            <div className="p-4 bg-amber-50 rounded-xl border border-amber-200">
                                <h3 className="font-bold text-amber-900 mb-2 text-lg">std::multiset</h3>
                                <p className="text-sm mb-2">Cho phép lưu trữ các <strong>phần tử trùng lặp</strong>, vẫn duy trì thứ tự sắp xếp.</p>
                                <div className="text-xs bg-amber-100 p-2.5 rounded text-amber-900 font-mono">
                                    ⚠️ <strong>Lưu ý quan trọng:</strong> <br/>
                                    - <code className="font-bold">ms.erase(x)</code> sẽ xóa <strong>TẤT CẢ</strong> phần tử có giá trị x.<br/>
                                    - Để chỉ xóa 1 phần tử x: <code className="font-bold">ms.erase(ms.find(x))</code>.
                                </div>
                            </div>
                            <div className="p-4 bg-purple-50 rounded-xl border border-purple-200">
                                <h3 className="font-bold text-purple-900 mb-2 text-lg">std::unordered_set</h3>
                                <p className="text-sm mb-2">Sử dụng **Bảng Băm (Hash Table)**. Các phần tử **KHÔNG** được sắp xếp theo thứ tự.</p>
                                <div className="text-xs bg-purple-100 p-2.5 rounded text-purple-900 font-mono">
                                    🚀 <strong>Ưu điểm:</strong> <br/>
                                    - Độ phức tạp trung bình cho tìm kiếm/chèn/xóa chỉ là <Latex formula="O(1)" />.<br/>
                                    - Rất thích hợp khi chỉ cần kiểm tra sự tồn tại.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        /* COMPONENT: VẼ CÂY NHỊ PHÂN / RED-BLACK TREE */
        const BSTView = ({ elements, current }) => {
            if (!elements || elements.length === 0) return <span className="text-slate-400 italic text-sm">Cây đang rỗng {}</span>;

            // Xây dựng cây nhị phân (Binary Search Tree)
            const Node = function(val) { this.val = val; this.left = null; this.right = null; };
            let root = null;
            
            elements.forEach((val) => {
                if (!root) { root = new Node(val); return; }
                let curr = root;
                while (true) {
                    if (val < curr.val) {
                        if (!curr.left) { curr.left = new Node(val); break; }
                        curr = curr.left;
                    } else if (val > curr.val) {
                        if (!curr.right) { curr.right = new Node(val); break; }
                        curr = curr.right;
                    } else break; 
                }
            });

            // Tính toán toạ độ và màu Red-Black Tree giả lập
            const nodes = [];
            const links = [];
            const traverse = (node, x, y, level) => {
                if (!node) return;
                const dx = level === 0 ? 75 : 45;
                const dy = 55;
                if (node.left) {
                    const nx = x - dx;
                    const ny = y + dy;
                    links.push({ x1: x, y1: y, x2: nx, y2: ny });
                    traverse(node.left, nx, ny, level + 1);
                }
                if (node.right) {
                    const nx = x + dx;
                    const ny = y + dy;
                    links.push({ x1: x, y1: y, x2: nx, y2: ny });
                    traverse(node.right, nx, ny, level + 1);
                }
                
                // Quy tắc màu giả lập cho dải 5,2,8,1,9
                let isRed = false;
                if (elements.length < 4) {
                    if (node.val !== 5) isRed = true; 
                } else {
                    if (node.val === 1 || node.val === 9) isRed = true;
                }
                nodes.push({ val: node.val, x, y, isRed });
            };
            
            traverse(root, 150, 25, 0);

            return (
                <svg width="100%" height="200" viewBox="0 0 300 200" className="overflow-visible mt-2">
                    {links.map((l, i) => (
                        <line key={'l'+i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke="#cbd5e1" strokeWidth="2.5" />
                    ))}
                    {nodes.map((n, i) => {
                        const isActive = n.val === current;
                        const fillColor = isActive ? '#f59e0b' : (n.isRed ? '#e11d48' : '#1e293b');
                        const strokeColor = isActive ? '#fef3c7' : (n.isRed ? '#ffe4e6' : '#94a3b8');
                        return (
                            <g key={'n'+i} transform={`translate(${n.x}, ${n.y})`} className="transition-all duration-500">
                                <circle r="18" fill={fillColor} 
                                        stroke={strokeColor} 
                                        strokeWidth="3" 
                                        className="transition-all duration-300 shadow-xl"/>
                                <text textAnchor="middle" dy=".3em" fill="white" fontSize="14" fontFamily="monospace" fontWeight="bold">{n.val}</text>
                            </g>
                        );
                    })}
                </svg>
            );
        };

        /* TAB 2: MÔ PHỎNG */
        const SimulationTab = () => {
            const inputSeq = [5, 2, 8, 2, 5, 1, 9];
            
            // Đã đổi cur.set thành cur.elements để biểu diễn quá trình chèn thứ tự vào Cây Nhị Phân
            const steps = [
                { elements: [], setSize: 0, current: null, action: "Khởi tạo set rỗng: s = {}", line: 1, msg: "Tập hợp rỗng ban đầu. Chuẩn bị gốc (Root)." },
                { elements: [5], setSize: 1, current: 5, action: "Chèn 5 vào set", line: 4, msg: "Thêm số 5 vào set làm Nút Gốc (Màu Đen)." },
                { elements: [5, 2], setSize: 2, current: 2, action: "Chèn 2 vào set", line: 4, msg: "2 < 5 -> Đưa sang nhánh TRÁI (Màu Đỏ)." },
                { elements: [5, 2, 8], setSize: 3, current: 8, action: "Chèn 8 vào set", line: 4, msg: "8 > 5 -> Đưa sang nhánh PHẢI (Màu Đỏ)." },
                { elements: [5, 2, 8], setSize: 3, current: 2, action: "Thử chèn 2 (Trùng lặp)", line: 4, msg: "Duyệt cây: Số 2 ĐÃ TỒN TẠI! Bỏ qua không chèn." },
                { elements: [5, 2, 8], setSize: 3, current: 5, action: "Thử chèn 5 (Trùng lặp)", line: 4, msg: "Duyệt cây: Số 5 ĐÃ TỒN TẠI! Bỏ qua không chèn." },
                { elements: [5, 2, 8, 1], setSize: 4, current: 1, action: "Chèn 1 vào set", line: 4, msg: "1 < 5 -> 1 < 2 -> Nhánh TRÁI của 2. Cây tự động cân bằng (Recoloring)." },
                { elements: [5, 2, 8, 1, 9], setSize: 5, current: 9, action: "Chèn 9 vào set", line: 4, msg: "9 > 5 -> 9 > 8 -> Nhánh PHẢI của 8. Cấu trúc Red-Black Tree luôn ổn định độ cao." },
                { elements: [5, 2, 8, 1, 9], setSize: 5, current: null, action: "Duyệt qua set", line: 7, msg: "Duyệt cây Trung Thứ Tự (In-order traversal) cho ra mảng tăng dần: 1 2 5 8 9." }
            ];

            const [stepIdx, setStepIdx] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);

            useEffect(() => {
                let timer;
                if (isPlaying && stepIdx < steps.length - 1) {
                    timer = setTimeout(() => setStepIdx(prev => prev + 1), 1800); // Tăng thời gian để xem cây vẽ rõ hơn
                } else {
                    setIsPlaying(false);
                }
                return () => clearTimeout(timer);
            }, [isPlaying, stepIdx]);

            const cur = steps[stepIdx];

            const codeLines = [
                { num: 1, code: "set<int> s;" },
                { num: 2, code: "vector<int> a = {5, 2, 8, 2, 5, 1, 9};" },
                { num: 3, code: "for (int x : a) {" },
                { num: 4, code: "    s.insert(x); // Xây dựng Red-Black Tree" },
                { num: 5, code: "}" },
                { num: 6, code: "// In các phần tử trong set" },
                { num: 7, code: "for (int x : s) cout << x << ' ';" }
            ];

            return (
                <div className="fade-in space-y-6">
                    {/* Bảng điều khiển mô phỏng */}
                    <div className="bg-slate-900 text-white p-5 rounded-2xl shadow-xl flex flex-wrap items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setStepIdx(0)} className="sim-btn bg-rose-600 text-white">Reset</button>
                            <button disabled={stepIdx === 0} onClick={() => setStepIdx(prev => prev - 1)} className="sim-btn bg-slate-700 disabled:opacity-30">◄ Trước</button>
                            <button onClick={() => setIsPlaying(!isPlaying)} className={`sim-btn ${isPlaying ? 'bg-amber-500' : 'bg-blue-600'}`}>
                                {isPlaying ? 'Tạm Dừng' : 'Tự Động Chạy'}
                            </button>
                            <button disabled={stepIdx === steps.length - 1} onClick={() => setStepIdx(prev => prev + 1)} className="sim-btn bg-slate-700 disabled:opacity-30">Sau ►</button>
                        </div>
                        <div className="font-mono text-xs text-blue-300">
                            Bước: <span className="text-white font-bold text-sm">{stepIdx + 1}</span> / {steps.length}
                        </div>
                    </div>

                    {/* Dữ liệu đầu vào */}
                    <div className="p-4 bg-white rounded-xl border border-slate-200 flex flex-wrap items-center justify-around gap-4 text-center">
                        <div>
                            <span className="text-[10px] font-black uppercase text-slate-400 block">Dãy số đầu vào</span>
                            <div className="flex gap-1.5 mt-1">
                                {inputSeq.map((num, idx) => (
                                    <span key={idx} className={`w-8 h-8 flex items-center justify-center rounded-lg font-mono font-bold text-sm border ${stepIdx > 0 && inputSeq[stepIdx-1] === num && idx === stepIdx-1 ? 'bg-amber-500 text-white border-amber-600 scale-110 shadow' : 'bg-slate-100 text-slate-700 border-slate-200'}`}>
                                        {num}
                                    </span>
                                ))}
                            </div>
                        </div>
                        <div>
                            <span className="text-[10px] font-black uppercase text-slate-400 block">Hành Động Hiện Tại</span>
                            <div className="font-mono text-sm font-bold text-blue-700 mt-1">{cur.action}</div>
                        </div>
                        <div>
                            <span className="text-[10px] font-black uppercase text-slate-400 block">Kích Thước Set (s.size())</span>
                            <div className="font-mono text-sm font-bold text-emerald-600 mt-1">{cur.setSize} phần tử</div>
                        </div>
                    </div>

                    {/* Sắp xếp hình mô phỏng và Code Highlight ngang hàng nhau */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">
                        {/* Khung trực quan hóa tập hợp Set */}
                        <div className="content-card flex flex-col items-center justify-between mb-0 h-full">
                            <h3 className="text-xs font-bold uppercase tracking-widest text-slate-400 mb-4">Mô phỏng Trạng Thái Của std::set (Red-Black Tree)</h3>
                            
                            <div className="w-full my-auto flex flex-col items-center justify-center min-h-[220px] bg-slate-50 border-2 border-dashed border-blue-300 rounded-2xl">
                                <BSTView elements={cur.elements} current={cur.current} />
                            </div>

                            <div className="mt-4 w-full px-4 py-3 rounded-lg text-xs font-bold text-center bg-blue-50 text-blue-900 border border-blue-200">
                                💡 {cur.msg}
                            </div>
                        </div>

                        {/* Code Highlight */}
                        <div className="content-card bg-slate-900 border-none text-white p-6 shadow-2xl flex flex-col justify-between mb-0 h-full">
                            <div className="text-xs font-bold uppercase tracking-widest text-slate-400 mb-4 border-b border-slate-800 pb-2">
                                Mã Nguồn C++ Tương Ứng
                            </div>
                            <div className="code-font space-y-2 my-auto">
                                {codeLines.map((l) => (
                                    <div 
                                        key={l.num} 
                                        className={`code-line flex items-center ${cur.line === l.num ? 'active text-blue-300' : 'text-slate-400'}`}
                                    >
                                        <span className="w-8 shrink-0 text-slate-600 text-xs font-mono">{l.num}</span>
                                        <pre className="inline">{l.code}</pre>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        /* TAB 3: CÀI ĐẶT */
        const CodeTab = () => {
            return (
                <div className="fade-in max-w-5xl mx-auto space-y-6">
                    <div className="content-card bg-slate-900 border-none p-0 overflow-hidden shadow-2xl">
                        <div className="flex justify-between items-center px-8 py-5 bg-slate-800 text-slate-400 border-b border-slate-700">
                            <div className="flex items-center gap-2">
                                <div className="w-3 h-3 rounded-full bg-rose-500"></div>
                                <div className="w-3 h-3 rounded-full bg-amber-500"></div>
                                <div className="w-3 h-3 rounded-full bg-emerald-500 mr-2"></div>
                                <span className="code-font italic text-sm font-bold text-slate-300">std_set_demo.cpp</span>
                            </div>
                            <span className="text-[10px] font-black uppercase tracking-widest bg-slate-700 px-3 py-1 rounded text-slate-100">C++17</span>
                        </div>
                        <div className="p-8 overflow-x-auto">
                            <pre className="code-font text-blue-300 leading-relaxed text-xs">
{`#include <iostream>
#include <set>
#include <unordered_set>

using namespace std;

int main() {
    // 1. Khai báo std::set
    set<int> s;

    // 2. Chèn phần tử
    s.insert(10);
    s.insert(5);
    s.insert(20);
    s.insert(5); // Số 5 trùng lặp sẽ bị tự động bỏ qua

    // 3. In ra các phần tử (kết quả sẽ tự động sắp xếp: 5 10 20)
    cout << "Cac phan tu trong set: ";
    for (int x : s) {
        cout << x << " ";
    }
    cout << "\\n";

    // 4. Kiểm tra sự tồn tại của một phần tử bằng find()
    int val = 10;
    if (s.find(val) != s.end()) {
        cout << "Tim thay " << val << " trong set!\\n";
    } else {
        cout << "Khong tim thay " << val << "\\n";
    }

    // 5. Xóa phần tử
    s.erase(5);
    cout << "Kich thuoc set sau khi xoa 5: " << s.size() << "\\n";

    // 6. Ví dụ multiset (Cho phép trùng lặp)
    multiset<int> ms;
    ms.insert(7);
    ms.insert(7);
    ms.insert(7);
    cout << "So luong phan tu 7 trong multiset: " << ms.count(7) << "\\n"; // In ra 3

    return 0;
}`}
                            </pre>
                        </div>
                    </div>
                </div>
            );
        };

        /* TAB 4: TRẮC NGHIỆM */
        const QuizTab = () => {
            const questions = [
                {
                    q: "Đặc điểm quan trọng nhất của cấu trúc dữ liệu std::set trong C++ là gì?",
                    o: ["Các phần tử trùng nhau được giữ nguyên và sắp xếp theo thứ tự chèn", "Các phần tử là duy nhất (không trùng lặp) và luôn tự động được sắp xếp", "Có thể truy cập phần tử ngẫu nhiên nhanh bằng chỉ số s[i]", "Không cho phép tìm kiếm phần tử"],
                    a: 1,
                    e: "std::set lưu trữ các phần tử duy nhất (tự động loại bỏ giá trị trùng) và luôn duy trì thứ tự sắp xếp (mặc định là tăng dần)."
                },
                {
                    q: "Độ phức tạp thời gian của phép toán s.insert(x) trong std::set có N phần tử là bao nhiêu?",
                    o: ["O(1)", "O(log N)", "O(N)", "O(N log N)"],
                    a: 1,
                    e: "std::set được cài đặt bằng Cây Nhị Phân Tìm Kiếm Cân Bằng (Red-Black Tree), do đó các thao tác chèn, xóa, tìm kiếm đều mất độ phức tạp O(log N)."
                },
                {
                    q: "Cách nào dưới đây ĐÚNG để duyệt qua toàn bộ phần tử trong một std::set<int> s?",
                    o: ["for(int i = 0; i < s.size(); i++) cout << s[i];", "for(int x : s) cout << x << ' ';", "for(int i = 1; i <= s.size(); i++) cout << s.at(i);", "s.get_all();"],
                    a: 1,
                    e: "std::set không hỗ trợ truy cập ngẫu nhiên qua toán tử chỉ số s[i]. Ta phải dùng vòng lặp range-based for hoặc con trỏ iterator."
                },
                {
                    q: "Hàm s.count(x) trong std::set trả về những giá trị nào?",
                    o: ["Số lượng vị trí của x trong mảng", "Trả về 1 nếu x có trong set, ngược lại trả về 0", "Trả về tổng tất cả các phần tử nhỏ hơn x", "Trả về chỉ số index của x"],
                    a: 1,
                    e: "Vì các phần tử trong std::set là duy nhất, nên x chỉ có thể xuất hiện 1 lần (trả về 1) hoặc không xuất hiện (trả về 0)."
                },
                {
                    q: "Sự khác biệt lớn nhất giữa std::set và std::multiset là gì?",
                    o: ["multiset không tự sắp xếp phần tử", "multiset cho phép lưu trữ các phần tử trùng lặp", "multiset có tốc độ truy xuất O(1)", "multiset chỉ lưu trữ được số thực"],
                    a: 1,
                    e: "std::multiset vẫn duy trì thứ tự sắp xếp như set, nhưng cho phép chèn nhiều phần tử có giá trị giống nhau."
                },
                {
                    q: "Cho multiset<int> ms = {2, 2, 2, 5}. Nếu gọi ms.erase(2) thì điều gì sẽ xảy ra?",
                    o: ["Chỉ có số 2 đầu tiên bị xóa", "TẤT CẢ các số 2 đều bị xóa khỏi multiset", "Chương trình báo lỗi", "Không có số nào bị xóa"],
                    a: 1,
                    e: "Khi truyền trực tiếp giá trị x vào ms.erase(x), multiset sẽ xóa TOÀN BỘ các phần tử có giá trị x. Để chỉ xóa 1 phần tử, ta dùng ms.erase(ms.find(x))."
                },
                {
                    q: "Cấu trúc dữ liệu nào dưới đây giúp tìm kiếm/chèn/xóa với độ phức tạp trung bình O(1)?",
                    o: ["std::set", "std::multiset", "std::unordered_set", "std::vector"],
                    a: 2,
                    e: "std::unordered_set sử dụng Bảng Băm (Hash Table) nên đạt độ phức tạp O(1) cho các thao tác cơ bản (tuy nhiên không sắp xếp phần tử)."
                },
                {
                    q: "Nếu hàm s.find(x) KHÔNG tìm thấy giá trị x trong set s, nó sẽ trả về giá trị gì?",
                    o: ["NULL", "-1", "0", "s.end()"],
                    a: 3,
                    e: "Khi không tìm thấy x, hàm find() trả về iterator chỉ tới s.end() (vị trí đằng sau phần tử cuối cùng của set)."
                },
                {
                    q: "Cho đoạn code: set<int> s = {4, 1, 3, 1, 2}; Hỏi s.size() bằng bao nhiêu?",
                    o: ["5", "4", "3", "Chương trình bị lỗi"],
                    a: 1,
                    e: "Số 1 bị trùng lặp nên set chỉ lưu các phần tử duy nhất: {1, 2, 3, 4}. Do đó kích thước s.size() = 4."
                },
                {
                    q: "Đoạn code sau in ra màn hình kết quả là gì?\nset<int, greater<int>> s = {3, 1, 4};\nfor(int x : s) cout << x << ' ';",
                    o: ["1 3 4", "4 3 1", "3 1 4", "1 4 3"],
                    a: 1,
                    e: "Khai báo `greater<int>` làm cho set tự động sắp xếp các phần tử theo thứ tự GIẢM DẦN, do đó kết quả in ra là 4 3 1."
                }
            ];

            const [userAns, setUserAns] = useState({});
            const [submitted, setSubmitted] = useState(false);

            const handleSelect = (qIdx, oIdx) => {
                if (submitted) return;
                setUserAns(prev => ({ ...prev, [qIdx]: oIdx }));
            };

            const isAllAnswered = Object.keys(userAns).length === questions.length;
            const score = Object.keys(userAns).filter(k => userAns[k] === questions[k].a).length;

            return (
                <div className="fade-in max-w-4xl mx-auto space-y-6 pb-24">
                    <div className="content-card bg-blue-50 border-blue-200">
                        <h2 className="text-xl font-black text-blue-700 uppercase tracking-widest mb-1 flex items-center">
                            <Icon name="quiz" /> Bài Tập Trắc Nghiệm Củng Cố Cấu Trúc Set
                        </h2>
                        <p className="text-sm text-blue-800">Trả lời toàn bộ 10 câu hỏi bên dưới để mở khóa nút Nộp Bài và xem đáp án giải thích chi tiết.</p>
                    </div>

                    {questions.map((item, qIdx) => (
                        <div key={qIdx} className="content-card">
                            <h3 className="font-bold text-slate-800 text-base mb-4 flex gap-2">
                                <span className="text-blue-600 font-extrabold whitespace-nowrap">Câu {qIdx + 1}:</span>
                                <span className="whitespace-pre-line">{item.q}</span>
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {item.o.map((opt, oIdx) => {
                                    let cls = "p-3 rounded-xl border-2 text-sm font-semibold transition-all text-left cursor-pointer ";
                                    
                                    if (userAns[qIdx] === oIdx) {
                                        cls += submitted 
                                            ? (oIdx === item.a ? "border-emerald-500 bg-emerald-50 text-emerald-800" : "border-rose-500 bg-rose-50 text-rose-800")
                                            : "border-blue-600 bg-blue-50 text-blue-900";
                                    } else {
                                        cls += (submitted && oIdx === item.a)
                                            ? "border-emerald-500 bg-emerald-50 text-emerald-800"
                                            : "border-slate-100 bg-slate-50 text-slate-600 hover:border-slate-300";
                                    }

                                    return (
                                        <button key={oIdx} onClick={() => handleSelect(qIdx, oIdx)} className={cls}>
                                            <span className="font-bold mr-1.5">{String.fromCharCode(65 + oIdx)}.</span> {opt}
                                        </button>
                                    );
                                })}
                            </div>

                            {submitted && (
                                <div className={`mt-4 p-3 rounded-lg text-sm italic ${userAns[qIdx] === item.a ? "bg-emerald-100 text-emerald-900" : "bg-rose-100 text-rose-900"}`}>
                                    <strong>Giải thích:</strong> {item.e}
                                </div>
                            )}
                        </div>
                    ))}

                    {/* Thanh Nộp Bài Cố Định Ở Đáy */}
                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-md px-6 py-3 rounded-full shadow-2xl border border-slate-200 flex items-center gap-4 z-50">
                        {!submitted ? (
                            <button 
                                disabled={!isAllAnswered}
                                onClick={() => setSubmitted(true)}
                                className="bg-blue-600 text-white px-8 py-2.5 rounded-full font-black text-xs uppercase tracking-widest hover:bg-blue-700 disabled:opacity-40 transition-all shadow-lg shadow-blue-200"
                            >
                                {isAllAnswered ? "Nộp Bài Ngay" : `Đã làm ${Object.keys(userAns).length}/10 câu`}
                            </button>
                        ) : (
                            <div className="flex items-center gap-4">
                                <span className="font-extrabold text-sm text-blue-700">Điểm số: {score} / 10</span>
                                <button 
                                    onClick={() => { setUserAns({}); setSubmitted(false); window.scrollTo(0,0); }}
                                    className="bg-slate-800 text-white px-6 py-2 rounded-full font-bold text-xs uppercase tracking-widest hover:bg-slate-900"
                                >
                                    Làm Lại
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        /* MAIN APP */
        const App = () => {
            const [tab, setTab] = useState('theory');

            return (
                <div className="min-h-screen bg-slate-50">
                    <nav className="bg-white/80 backdrop-blur-md shadow-sm border-b sticky top-0 z-[100] border-slate-200">
                        <div className="max-w-7xl mx-auto px-6 flex items-center justify-between h-16">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-blue-600 to-blue-700 rounded-xl flex items-center justify-center text-white font-black shadow-lg shadow-blue-100 transform -rotate-3">SET</div>
                                <div className="flex flex-col">
                                    <div className="font-black text-lg text-slate-900 tracking-tighter italic uppercase leading-none">C++ STL <span className="text-blue-600">std::set</span></div>
                                    <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-0.5">Bài Giảng Cấu Trúc Dữ Liệu</span>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                {[
                                    {id:'theory', n:'Lý thuyết', i:'theory'},
                                    {id:'sim', n:'Mô phỏng', i:'sim'},
                                    {id:'code', n:'Cài đặt', i:'code'},
                                    {id:'quiz', n:'Luyện tập', i:'quiz'}
                                ].map(t=>(
                                    <button key={t.id} onClick={()=>setTab(t.id)} className={`tab-btn text-xs ${tab===t.id?'active':''}`}>
                                        <Icon name={t.i} size={16}/>
                                        <span className="hidden sm:inline ml-1">{t.n}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </nav>
                    <main className="max-w-7xl mx-auto p-6">
                        <div className="max-w-5xl mx-auto">
                            {tab === 'theory' && <TheoryTab />}
                            {tab === 'sim' && <SimulationTab />}
                            {tab === 'code' && <CodeTab />}
                            {tab === 'quiz' && <QuizTab />}
                        </div>
                    </main>
                    <footer className="max-w-7xl mx-auto px-6 py-8 text-center text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em]">
                        &copy; 2026 Interactive Algorithm Learning Lab - Cấu Trúc Dữ Liệu std::set
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
