        /* COMPONENT: VẼ CÂY NHỊ PHÂN / RED-BLACK TREE CHO MAP */
        const MapBSTView = ({ elements, current }) => {
            if (!elements || elements.length === 0) return <span className="text-slate-400 italic text-base">Cây map đang rỗng {}</span>;

            const Node = function(k, v) { this.k = k; this.v = v; this.left = null; this.right = null; };
            let root = null;
            
            elements.forEach((item) => {
                if (!root) { root = new Node(item.k, item.v); return; }
                let curr = root;
                while (true) {
                    if (item.k < curr.k) {
                        if (!curr.left) { curr.left = new Node(item.k, item.v); break; }
                        curr = curr.left;
                    } else if (item.k > curr.k) {
                        if (!curr.right) { curr.right = new Node(item.k, item.v); break; }
                        curr = curr.right;
                    } else {
                        curr.v = item.v; // Cập nhật Value nếu trùng Key
                        break; 
                    }
                }
            });

            const nodes = [];
            const links = [];
            const traverse = (node, x, y, level) => {
                if (!node) return;
                const dx = level === 0 ? 75 : 45;
                const dy = 55;
                if (node.left) {
                    const nx = x - dx;
                    const ny = y + dy;
                    links.push({ x1: x, y1: y, x2: nx, y2: ny });
                    traverse(node.left, nx, ny, level + 1);
                }
                if (node.right) {
                    const nx = x + dx;
                    const ny = y + dy;
                    links.push({ x1: x, y1: y, x2: nx, y2: ny });
                    traverse(node.right, nx, ny, level + 1);
                }
                
                let isRed = false;
                if (elements.length < 4) {
                    if (node.k !== 5) isRed = true; 
                } else {
                    if (node.k === 1 || node.k === 9) isRed = true;
                }
                nodes.push({ k: node.k, v: node.v, x, y, isRed });
            };
            
            traverse(root, 150, 25, 0);

            return (
                <svg width="100%" height="210" viewBox="0 0 300 210" className="overflow-visible mt-2">
                    {links.map((l, i) => (
                        <line key={'l'+i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke="#cbd5e1" strokeWidth="2.5" />
                    ))}
                    {nodes.map((n, i) => {
                        const isActive = n.k === current;
                        const fillColor = isActive ? '#f59e0b' : (n.isRed ? '#e11d48' : '#1e293b');
                        const strokeColor = isActive ? '#fef3c7' : (n.isRed ? '#ffe4e6' : '#94a3b8');
                        return (
                            <g key={'n'+i} transform={`translate(${n.x}, ${n.y})`} className="transition-all duration-500">
                                <circle r="20" fill={fillColor} 
                                        stroke={strokeColor} 
                                        strokeWidth="3" 
                                        className="transition-all duration-300 shadow-xl"/>
                                <text textAnchor="middle" dy="-.1em" fill="white" fontSize="12" fontFamily="monospace" fontWeight="bold">{n.k}</text>
                                <text textAnchor="middle" dy="1.1em" fill="#fde047" fontSize="9" fontFamily="sans-serif" fontWeight="bold">{n.v}</text>
                            </g>
                        );
                    })}
                </svg>
            );
        };

                { elements: [{k:5, v:"Nam"}, {k:2, v:"Bình"}, {k:8, v:"Hoa"}, {k:1, v:"Đạt"}], mapSize: 4, current: 1, action: "mp[1] = \"Đạt\"", line: 4, msg: "Key 1 < 5 -> 1 < 2 -> Nhánh TRÁI của 2. Cây tự động cân bằng." },
                { elements: [{k:5, v:"Nam"}, {k:2, v:"Bình"}, {k:8, v:"Hoa"}, {k:1, v:"Đạt"}, {k:9, v:"Lâm"}], mapSize: 5, current: 9, action: "mp[9] = \"Lâm\"", line: 4, msg: "Key 9 > 5 -> 9 > 8 -> Nhánh PHẢI của 8. Cấu trúc Red-Black Tree ổn định." },
                { elements: [{k:5, v:"Nam"}, {k:2, v:"Bình"}, {k:8, v:"Hoa"}, {k:1, v:"Đạt"}, {k:9, v:"Lâm"}], mapSize: 5, current: null, action: "Duyệt qua map (In-order)", line: 7, msg: "Duyệt cây Trung Thứ Tự cho danh sách tăng dần theo Key: 1(Đạt) 2(Bình) 5(Nam) 8(Hoa) 9(Lâm)." }
            ];

            const [stepIdx, setStepIdx] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);

            useEffect(() => {
                let timer;
                if (isPlaying && stepIdx < steps.length - 1) {
                    timer = setTimeout(() => setStepIdx(prev => prev + 1), 1800);
                } else {
                    setIsPlaying(false);
                }
                return () => clearTimeout(timer);
            }, [isPlaying, stepIdx]);

            const cur = steps[stepIdx];

            const codeLines = [
                { num: 1, code: "map<int, string> mp;" },
                { num: 2, code: "// Thêm và cập nhật phần tử" },
                { num: 3, code: "mp[5] = \"Nam\"; mp[2] = \"An\";" },
                { num: 4, code: "mp[8] = \"Hoa\"; mp[2] = \"Bình\";" },
                { num: 5, code: "mp[1] = \"Đạt\"; mp[9] = \"Lâm\";" },
                { num: 6, code: "// Duyệt qua map" },
                { num: 7, code: "for (auto item : mp) cout << item.first << ':' << item.second;" }
            ];

            return (
                <div className="fade-in space-y-6">
                    {/* Bảng điều khiển mô phỏng */}
                    <div className="bg-slate-900 text-white p-5 rounded-2xl shadow-xl flex flex-wrap items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setStepIdx(0)} className="sim-btn bg-rose-600 text-white">Reset</button>
                            <button disabled={stepIdx === 0} onClick={() => setStepIdx(prev => prev - 1)} className="sim-btn bg-slate-700 disabled:opacity-30">◄ Trước</button>
                            <button onClick={() => setIsPlaying(!isPlaying)} className={`sim-btn ${isPlaying ? 'bg-amber-500' : 'bg-blue-600'}`}>
                                {isPlaying ? 'Tạm Dừng' : 'Tự Động Chạy'}
                            </button>
                            <button disabled={stepIdx === steps.length - 1} onClick={() => setStepIdx(prev => prev + 1)} className="sim-btn bg-slate-700 disabled:opacity-30">Sau ►</button>
                        </div>
                        <div className="font-mono text-sm text-blue-300">
                            Bước: <span className="text-white font-bold text-base">{stepIdx + 1}</span> / {steps.length}
                        </div>
                    </div>

                    {/* Dữ liệu đầu vào */}
                    <div className="p-4 bg-white rounded-xl border border-slate-200 flex flex-wrap items-center justify-around gap-4 text-center">
                        <div>
                            <span className="text-xs font-black uppercase text-slate-400 block">Dãy thao tác nạp Key:Value</span>
                            <div className="flex gap-1.5 mt-1">
                                {inputSeq.map((item, idx) => (
                                    <span key={idx} className={`px-2 py-1 flex items-center justify-center rounded-lg font-mono font-bold text-sm border ${stepIdx > 0 && idx === stepIdx-1 ? 'bg-amber-500 text-white border-amber-600 scale-105 shadow' : 'bg-slate-100 text-slate-700 border-slate-200'}`}>
                                        {item.k}:{item.v}
                                    </span>
                                ))}
                            </div>
                        </div>
                        <div>
                            <span className="text-xs font-black uppercase text-slate-400 block">Hành Động Hiện Tại</span>
                            <div className="font-mono text-base font-bold text-blue-700 mt-1">{cur.action}</div>
                        </div>
                        <div>
                            <span className="text-xs font-black uppercase text-slate-400 block">Kích Thước Map (mp.size())</span>
                            <div className="font-mono text-base font-bold text-emerald-600 mt-1">{cur.mapSize} phần tử</div>
                        </div>
                    </div>

                    {/* Mô phỏng & Code Highlight */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">
                        {/* Khung trực quan hóa std::map */}
                        <div className="content-card flex flex-col items-center justify-between mb-0 h-full">
                            <h3 className="text-sm font-bold uppercase tracking-widest text-slate-400 mb-4">Mô phỏng Trạng Thái std::map (Red-Black Tree)</h3>
                            
                            <div className="w-full my-auto flex flex-col items-center justify-center min-h-[220px] bg-slate-50 border-2 border-dashed border-blue-300 rounded-2xl">
                                <MapBSTView elements={cur.elements} current={cur.current} />
                            </div>

                            <div className="mt-4 w-full px-4 py-3 rounded-lg text-sm font-bold text-center bg-blue-50 text-blue-900 border border-blue-200">
                                💡 {cur.msg}
                            </div>
                        </div>

                        {/* Code Highlight */}
                        <div className="content-card bg-slate-900 border-none text-white p-6 shadow-2xl flex flex-col justify-between mb-0 h-full">
                            <div className="text-sm font-bold uppercase tracking-widest text-slate-400 mb-4 border-b border-slate-800 pb-2">
                                Mã Nguồn C++ Tương Ứng
                            </div>
                            <div className="code-font space-y-2 my-auto">
                                {codeLines.map((l) => (
                                    <div 
                                        key={l.num} 
                                        className={`code-line flex items-center ${cur.line === l.num ? 'active text-blue-300' : 'text-slate-400'}`}
                                    >
                                        <span className="w-8 shrink-0 text-slate-600 text-sm font-mono">{l.num}</span>
                                        <pre className="inline">{l.code}</pre>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        /* TAB 3: CÀI ĐẶT */
        const CodeTab = () => {
            return (
                <div className="fade-in max-w-5xl mx-auto space-y-6">
                    <div className="content-card bg-slate-900 border-none p-0 overflow-hidden shadow-2xl">
                        <div className="flex justify-between items-center px-8 py-5 bg-slate-800 text-slate-400 border-b border-slate-700">
                            <div className="flex items-center gap-2">
                                <div className="w-3 h-3 rounded-full bg-rose-500"></div>
                                <div className="w-3 h-3 rounded-full bg-amber-500"></div>
                                <div className="w-3 h-3 rounded-full bg-emerald-500 mr-2"></div>
                                <span className="code-font italic text-base font-bold text-slate-300">std_map_demo.cpp</span>
                            </div>
                            <span className="text-xs font-black uppercase tracking-widest bg-slate-700 px-3 py-1 rounded text-slate-100">C++17</span>
                        </div>
                        <div className="p-8 overflow-x-auto">
                            <pre className="code-font text-blue-300 leading-relaxed text-sm">
{`#include <iostream>
#include <map>
#include <unordered_map>
#include <vector>

using namespace std;

int main() {
    // 1. Khai báo std::map
    map<string, int> diemThi;

    // 2. Thêm và Cập nhật dữ liệu
    diemThi["An"] = 9;
    diemThi["Bình"] = 8;
    diemThi["Hoa"] = 10;
    diemThi["An"] = 10; // Cập nhật điểm của An từ 9 thành 10

    // 3. Duyệt map (Kết quả tự động sắp xếp tăng dần theo Key)
    cout << "--- Danh sach diem thi ---\\n";
    for (auto item : diemThi) {
        cout << item.first << ": " << item.second << " diem\\n";
    }

    // 4. Kiểm tra sự tồn tại của Key bằng find()
    string keySearch = "Bình";
    if (diemThi.find(keySearch) != diemThi.end()) {
        cout << "\\nTim thay " << keySearch << " voi so diem: " << diemThi[keySearch] << "\\n";
    }

    // 5. Ứng dụng phổ biến: Đếm tần suất xuất hiện
    vector<int> a = {2, 3, 2, 5, 3, 2, 8};
    map<int, int> freq;
    for (int x : a) {
        freq[x]++; // Tự động khởi tạo freq[x] = 0 nếu chưa có rồi cộng 1
    }

    cout << "\\n--- Tan suat xuat hien ---\\n";
    for (auto p : freq) {
        cout << "So " << p.first << " xuất hiện " << p.second << " lan\\n";
    }

    return 0;
}`}
                            </pre>
                        </div>
                    </div>
                </div>
            );
        };

        /* TAB 4: TRẮC NGHIỆM */
        const QuizTab = () => {
            const questions = [
                {
                    q: "Đặc điểm cốt lõi của cấu trúc dữ liệu std::map trong C++ là gì?",
                    o: ["Lưu các phần tử theo chỉ số index 0, 1, 2", "Lưu trữ cặp Key - Value, Key là duy nhất và tự động được sắp xếp", "Cho phép các Key trùng nhau hoàn toàn", "Không hỗ trợ tìm kiếm phần tử"],
                    a: 1,
                    e: "std::map lưu dữ liệu dưới dạng cặp Key-Value. Key luôn là duy nhất và các phần tử tự động sắp xếp tăng dần theo Key."
                },
                {
                    q: "Độ phức tạp thời gian của phép toán tìm kiếm mp.find(key) trong std::map có N phần tử là bao nhiêu?",
                    o: ["O(1)", "O(log N)", "O(N)", "O(N log N)"],
                    a: 1,
                    e: "std::map được cài đặt bằng Cây Nhị Phân Tìm Kiếm Cân Bằng (Red-Black Tree), do đó tìm kiếm, chèn, xóa đều đạt O(log N)."
                },
                {
                    q: "Điều gì xảy ra khi bạn gọi `mp[key]` với một Key CHƯA TỒN TẠI trong map kiểu <string, int>?",
                    o: ["Báo lỗi biên dịch", "Gây văng chương trình (Runtime Error)", "Tự động thêm Key đó vào map với Value mặc định = 0", "Không làm gì cả"],
                    a: 2,
                    e: "Toán tử [] sẽ tự động tạo mới phần tử với Key đó và gán Value mặc định (ví dụ kiểu int là 0) nếu Key chưa tồn tại."
                },
                {
                    q: "Khi duyệt qua std::map bằng lặp `for(auto item : mp)`, hai thuộc tính `item.first` và `item.second` đại diện cho điều gì?",
                    o: ["first là Value, second là Key", "first là Key, second là Value", "first là Chỉ số, second là Giá trị", "first là Giá trị cũ, second là Giá trị mới"],
                    a: 1,
                    e: "Trong mỗi cặp std::pair của map, .first chứa Khóa (Key) và .second chứa Giá trị (Value)."
                },
                {
                    q: "Sự khác biệt chính giữa std::map và std::unordered_map là gì?",
                    o: ["unordered_map cài đặt bằng Bảng băm (Hash Table), không sắp xếp Key và đạt tốc độ trung bình O(1)", "unordered_map sắp xếp Key giảm dần", "unordered_map cho phép trùng Key", "Không có sự khác biệt nào"],
                    a: 0,
                    e: "unordered_map sử dụng Hash Table cho tốc độ truy cập O(1), tuy nhiên các phần tử không được sắp xếp theo Key như std::map."
                },
                {
                    q: "Để kiểm tra xem Key x có tồn tại trong map mp hay không mà KHÔNG vô tình tạo mới phần tử rác, ta nên dùng cách nào?",
                    o: ["Dùng if (mp[x] != 0)", "Dùng mp.count(x) hoặc mp.find(x) != mp.end()", "Dùng mp.insert(x)", "Dùng mp.size()"],
                    a: 1,
                    e: "Dùng `count()` hoặc `find()` kiểm tra sự tồn tại an toàn mà không làm tự động chèn phần tử mới như toán tử `[]`."
                },
                {
                    q: "Cấu trúc dữ liệu nào cho phép lưu trữ nhiều cặp phần tử có KHÓA (Key) TRÙNG NHAU?",
                    o: ["std::map", "std::unordered_map", "std::multimap", "std::set"],
                    a: 2,
                    e: "std::multimap cho phép lưu giữ các phần tử có Key trùng lặp, vẫn giữ nguyên tính chất tự sắp xếp theo Key."
                },
                {
                    q: "Hàm mp.erase(key) thực hiện chức năng gì?",
                    o: ["Xóa toàn bộ map", "Xóa phần tử có Key tương ứng ra khỏi map", "Gán Value của Key về 0", "Xóa phần tử đầu tiên"],
                    a: 1,
                    e: "mp.erase(key) tìm và xóa cặp Key-Value có Khóa tương ứng ra khỏi map."
                },
                {
                    q: "Cho đoạn code: map<int, int> mp; mp[1] = 10; mp[1] = 20; Hỏi mp[1] và mp.size() bằng bao nhiêu?",
                    o: ["mp[1] = 10, size = 2", "mp[1] = 20, size = 1", "mp[1] = 30, size = 1", "Chương trình báo lỗi"],
                    a: 1,
                    e: "Vì Key trong map là duy nhất, lệnh `mp[1] = 20` sẽ ghi đè giá trị 10 thành 20. Kích thước map vẫn là 1."
                },
                {
                    q: "Đoạn code đếm tần suất `map<int, int> mp; for(int x : {3, 1, 3}) mp[x]++;` Khi in ra sẽ thu được kết quả gì?",
                    o: ["1 xuất hiện 1 lần, 3 xuất hiện 2 lần", "3 xuất hiện 2 lần, 1 xuất hiện 1 lần", "3 xuất hiện 1 lần, 1 xuất hiện 2 lần", "Lỗi chương trình"],
                    a: 0,
                    e: "Map tự động sắp xếp theo Key tăng dần, do đó phần tử Key 1 được in trước (1 lần), sau đó tới Key 3 (2 lần)."
                }
            ];

            const [userAns, setUserAns] = useState({});
            const [submitted, setSubmitted] = useState(false);

            const handleSelect = (qIdx, oIdx) => {
                if (submitted) return;
                setUserAns(prev => ({ ...prev, [qIdx]: oIdx }));
            };

            const isAllAnswered = Object.keys(userAns).length === questions.length;
            const score = Object.keys(userAns).filter(k => userAns[k] === questions[k].a).length;

            return (
                <div className="fade-in max-w-4xl mx-auto space-y-6 pb-24">
                    <div className="content-card bg-blue-50 border-blue-200">
                        <h2 className="text-xl font-black text-blue-700 uppercase tracking-widest mb-1 flex items-center">
                            <Icon name="quiz" /> Bài Tập Trắc Nghiệm Củng Cố Cấu Trúc Map
                        </h2>
                        <p className="text-base text-blue-800">Trả lời toàn bộ 10 câu hỏi bên dưới để mở khóa nút Nộp Bài và xem đáp án giải thích chi tiết.</p>
                    </div>

                    {questions.map((item, qIdx) => (
                        <div key={qIdx} className="content-card">
                            <h3 className="font-bold text-slate-800 text-lg mb-4 flex gap-2">
                                <span className="text-blue-600 font-extrabold whitespace-nowrap">Câu {qIdx + 1}:</span>
                                <span className="whitespace-pre-line">{item.q}</span>
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {item.o.map((opt, oIdx) => {
                                    let cls = "p-4 rounded-xl border-2 text-base font-semibold transition-all text-left cursor-pointer ";
                                    
                                    if (userAns[qIdx] === oIdx) {
                                        cls += submitted 
                                            ? (oIdx === item.a ? "border-emerald-500 bg-emerald-50 text-emerald-800" : "border-rose-500 bg-rose-50 text-rose-800")
                                            : "border-blue-600 bg-blue-50 text-blue-900";
                                    } else {
                                        cls += (submitted && oIdx === item.a)
                                            ? "border-emerald-500 bg-emerald-50 text-emerald-800"
                                            : "border-slate-100 bg-slate-50 text-slate-600 hover:border-slate-300";
                                    }

                                    return (
                                        <button key={oIdx} onClick={() => handleSelect(qIdx, oIdx)} className={cls}>
                                            <span className="font-bold mr-1.5">{String.fromCharCode(65 + oIdx)}.</span> {opt}
                                        </button>
                                    );
                                })}
                            </div>

                            {submitted && (
                                <div className={`mt-4 p-4 rounded-lg text-base italic ${userAns[qIdx] === item.a ? "bg-emerald-100 text-emerald-900" : "bg-rose-100 text-rose-900"}`}>
                                    <strong>Giải thích:</strong> {item.e}
                                </div>
                            )}
                        </div>
                    ))}

                    {/* Thanh Nộp Bài Cố Định Ở Đáy */}
                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-md px-6 py-3 rounded-full shadow-2xl border border-slate-200 flex items-center gap-4 z-50">
                        {!submitted ? (
                            <button 
                                disabled={!isAllAnswered}
                                onClick={() => setSubmitted(true)}
                                className="bg-blue-600 text-white px-8 py-3 rounded-full font-black text-sm uppercase tracking-widest hover:bg-blue-700 disabled:opacity-40 transition-all shadow-lg shadow-blue-200"
                            >
                                {isAllAnswered ? "Nộp Bài Ngay" : `Đã làm ${Object.keys(userAns).length}/10 câu`}
                            </button>
                        ) : (
                            <div className="flex items-center gap-4">
                                <span className="font-extrabold text-base text-blue-700">Điểm số: {score} / 10</span>
                                <button 
                                    onClick={() => { setUserAns({}); setSubmitted(false); window.scrollTo(0,0); }}
                                    className="bg-slate-800 text-white px-6 py-3 rounded-full font-bold text-sm uppercase tracking-widest hover:bg-slate-900"
                                >
                                    Làm Lại
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        /* MAIN APP */
        const App = () => {
            const [tab, setTab] = useState('theory');

            return (
                <div className="min-h-screen bg-slate-50">
                    <nav className="bg-white/80 backdrop-blur-md shadow-sm border-b sticky top-0 z-[100] border-slate-200">
                        <div className="max-w-7xl mx-auto px-6 flex items-center justify-between h-16">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-blue-600 to-blue-700 rounded-xl flex items-center justify-center text-white font-black shadow-lg shadow-blue-100 transform -rotate-3">MAP</div>
                                <div className="flex flex-col">
                                    <div className="font-black text-lg text-slate-900 tracking-tighter italic uppercase leading-none">C++ STL <span className="text-blue-600">std::map</span></div>
                                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-0.5">Bài Giảng Cấu Trúc Dữ Liệu</span>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                {[
                                    {id:'theory', n:'Lý thuyết', i:'theory'},
                                    {id:'sim', n:'Mô phỏng', i:'sim'},
                                    {id:'code', n:'Cài đặt', i:'code'},
                                    {id:'quiz', n:'Luyện tập', i:'quiz'}
                                ].map(t=>(
                                    <button key={t.id} onClick={()=>setTab(t.id)} className={`tab-btn text-sm ${tab===t.id?'active':''}`}>
                                        <Icon name={t.i} size={18}/>
                                        <span className="hidden sm:inline ml-1">{t.n}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </nav>
                    <main className="max-w-7xl mx-auto p-6">
                        <div className="max-w-5xl mx-auto">
                            {tab === 'theory' && <TheoryTab />}
                            {tab === 'sim' && <SimulationTab />}
                            {tab === 'code' && <CodeTab />}
                            {tab === 'quiz' && <QuizTab />}
                        </div>
                    </main>
                    <footer className="max-w-7xl mx-auto px-6 py-8 text-center text-slate-400 text-xs font-bold uppercase tracking-[0.2em]">
                        &copy; 2026 Interactive Algorithm Learning Lab - Cấu Trúc Dữ Liệu std::map
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
